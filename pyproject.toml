[project]
name = "nationstates-news-webhook"
version = "0.1.0"
description = "Poll NationStates announcements and deliver new posts to Discord."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "playwright>=1.52.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
ns-news-webhook = "ns_news_webhook:main"

[tool.uv]
package = false
